name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check community cases
        run: npm run community:check

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
