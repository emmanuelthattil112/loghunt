<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1017">
<meta name="description" content="A daily cybersecurity puzzle. Read simulated Windows-style logs and find the line that shows the attack.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>LogHunt</title>
<style>
:root {
  --bg: #0b1017;
  --panel: #131b26;
  --panel-2: #1a2535;
  --border: #263449;
  --text: #e6edf6;
  --muted: #8a9bb3;
  --accent: #4fb3ff;
  --good: #3ddc97;
  --bad: #ff6b6b;
  --warn: #f5b942;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
  min-height: 100vh;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(11, 16, 23, 0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; color: var(--accent); }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav button {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
nav button:hover { background: var(--panel-2); }
nav button.active { background: var(--accent); border-color: var(--accent); color: #06101a; font-weight: 700; }

main { max-width: 880px; margin: 0 auto; padding: 20px 16px 24px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 8px; }
h2 { font-size: 19px; margin: 24px 0 10px; }
h3 { font-size: 16px; margin: 0; }
p { margin: 8px 0; }
.lead { color: var(--muted); margin: 0 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
.foot { max-width: 880px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
.flash { color: var(--good); font-weight: 600; margin: 0 0 12px; }

.btn {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #06101a; }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; }
a { color: var(--accent); }
.actions { margin: 14px 0 4px; display: flex; gap: 10px; flex-wrap: wrap; }

.stats-row { display: flex; gap: 28px; margin: 18px 0; flex-wrap: wrap; }
.num { display: block; font-size: 30px; font-weight: 800; line-height: 1.1; }
.lbl { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.chip {
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
}
.chip.sev-High { color: var(--warn); border-color: var(--warn); }
.chip.sev-Critical { color: var(--bad); border-color: var(--bad); }
.tag {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 1px 7px;
}

.result { padding: 12px 14px; border-radius: 10px; margin: 14px 0; border: 1px solid; }
.result.good { border-color: var(--good); background: rgba(61, 220, 151, 0.08); }
.result.bad { border-color: var(--bad); background: rgba(255, 107, 107, 0.08); }
.hint {
  border-left: 3px solid var(--warn);
  background: rgba(245, 185, 66, 0.08);
  padding: 8px 12px;
  border-radius: 6px;
}

.lab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.text-input, .lab input, textarea, select {
  background: #080c12;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font: inherit;
}
.lab input[type="search"] { flex: 1 1 180px; min-width: 0; }
.text-input { width: 100%; }
textarea { width: 100%; min-height: 110px; border-radius: 10px; padding: 10px; resize: vertical; }
select { background: var(--panel-2); }

.log {
  font-family: var(--mono);
  font-size: 13.5px;
  background: #080c12;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  margin: 12px 0;
}
.line {
  display: flex;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  padding: 7px 8px;
  cursor: pointer;
  align-items: flex-start;
}
.line:hover:not(:disabled) { background: var(--panel-2); }
.line.selected { border-color: var(--accent); background: var(--panel-2); }
.line.correct { border-color: var(--good); background: rgba(61, 220, 151, 0.12); }
.line.wrong { border-color: var(--bad); background: rgba(255, 107, 107, 0.12); }
.line:disabled { cursor: default; }
.ln { color: var(--muted); min-width: 22px; user-select: none; text-align: right; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }

.timeline { border-bottom: 1px solid var(--border); margin-bottom: 8px; padding-bottom: 8px; }
.tl-row {
  display: grid;
  grid-template-columns: 56px 1fr 32px;
  gap: 8px;
  align-items: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  padding: 2px 8px;
}
.tl-bar { background: var(--panel-2); border-radius: 999px; height: 8px; overflow: hidden; }
.tl-bar span { display: block; height: 100%; background: var(--accent); }

.walk li { margin: 6px 0; }
.detect { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; margin-top: 16px; }
.detect .field + .field { margin-top: 10px; }

.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field select { width: 100%; }
.check { display: flex; gap: 8px; align-items: center; padding: 4px 0; }

.case-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.case-item, .case-item-static {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font: inherit;
  padding: 12px 14px;
}
.case-item { cursor: pointer; }
.case-item:hover { border-color: var(--accent); }
.ci-title { font-weight: 600; }
.ci-meta { grid-column: 1; color: var(--muted); font-size: 13px; }
.pill {
  grid-row: 1 / span 2;
  grid-column: 2;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.good { color: var(--good); border-color: var(--good); }

.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
.stat { background: var(--panel-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; }
.stat .num { font-size: 26px; }

.badges { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.badge-card {
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 12px;
  opacity: 0.55;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.badge-card.earned { opacity: 1; border-style: solid; border-color: var(--good); }

.share {
  font-family: var(--mono);
  background: #080c12;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  white-space: pre-wrap;
  font-size: 14px;
  margin: 10px 0;
}

.table-wrap { overflow-x: auto; }
table.board { width: 100%; border-collapse: collapse; }
table.board th, table.board td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
table.board tr.me td { color: var(--accent); font-weight: 700; }

.progress { height: 12px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.plain { list-style: none; padding: 0; margin: 8px 0; }
.plain li { padding: 4px 0; }

.note { border-top: 1px solid var(--border); padding: 12px 0; }
.note pre { white-space: pre-wrap; font-family: var(--sans); margin: 6px 0; }

#print-area { display: none; }

@media (max-width: 560px) {
  h1 { font-size: 22px; }
  .num { font-size: 26px; }
  .card { padding: 16px; }
}

@media print {
  body * { visibility: hidden !important; }
  #print-area, #print-area * { visibility: visible !important; }
  #print-area {
    display: block !important;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    background: #fff;
    color: #000;
    padding: 0 12px;
  }
  #print-area h1, #print-area h2 { color: #000; }
  #print-area .ws-log { font-family: monospace; font-size: 11px; white-space: pre-wrap; border: 1px solid #999; padding: 6px; }
  .page-break { break-before: page; }
  header.top, footer.foot, .flash { display: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">LogHunt</div>
  <nav aria-label="Main">

    <button type="button" data-view="notes">Notes</button>
  </nav>
</header>
<main id="app"></main>
<div id="print-area"></div>
<footer class="foot">All logs are simulated for training. No real systems or people are involved. ATT&amp;CK is a trademark of The MITRE Corporation.</footer>
<script>
// ---------- built-in cases ----------

const PUZZLES = [
  {
    id: 1,
    title: 'Spray and Pray',
    topic: 'Identity',
    difficulty: 'Medium',
    severity: 'High',
    attack: 'T1110.003',
    attackName: 'Password Spraying',
    scenario: 'A help desk ticket says a user got a sign-in alert. Review the Windows Security log from the domain controller for the last hour.',
    lines: [
      `08:01:12 Security 4625 Failed logon. Account: a.morgan  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:13 Security 4625 Failed logon. Account: j.kim  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:15 Security 4625 Failed logon. Account: m.patel  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:16 Security 4625 Failed logon. Account: r.lopez  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:18 Security 4625 Failed logon. Account: s.okafor  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:19 Security 4625 Failed logon. Account: t.nguyen  Source IP: 10.0.8.41  Reason: Unknown user name or bad password.`,
      `08:01:24 Security 4624 Successful logon. Account: h.ross  Logon type: 3  Source IP: 10.0.8.41`,
      `08:03:40 Security 4672 Special privileges assigned to new logon. Account: h.ross`,
      `08:07:11 Printer Service: Driver installed on PRN-03.`
    ],
    answer: 6,
    explanation: 'One source IP tried one password against many accounts (password spraying), and one of them worked. Reset that password, lock the account, and check what h.ross did next.',
    hint: 'One source IP appears again and again, with a different account name each time.',
    walkthrough: [
      'Many failed logons come from one IP, each with a different account name. That pattern is password spraying.',
      'One logon then succeeds from the same IP. That account is compromised.',
      'Check what the account did next, such as privilege assignment or file share access.',
      'Lock the account, reset the password, and block the source IP at the edge.'
    ]
  },
  {
    id: 2,
    title: 'Invoice Macro',
    topic: 'Malware',
    difficulty: 'Easy',
    severity: 'High',
    attack: 'T1566.001',
    attackName: 'Spearphishing Attachment',
    scenario: 'An employee says they opened an invoice attachment this morning. Review the endpoint telemetry from their laptop.',
    lines: [
      `09:12:40 Sysmon 1 Process create. Image: C:\\Program Files\\Microsoft Office\\OUTLOOK.EXE  ParentImage: explorer.exe`,
      `09:12:48 Sysmon 1 Process create. Image: C:\\Program Files\\Microsoft Office\\WINWORD.EXE  ParentImage: OUTLOOK.EXE  CommandLine: WINWORD.EXE /n "C:\\Users\\kwilson\\AppData\\Local\\Temp\\Invoice_0931.docm"`,
      `09:12:51 Sysmon 1 Process create. Image: powershell.exe  ParentImage: WINWORD.EXE  CommandLine: powershell -nop -w hidden -enc JABzAD0ATgBlAHcALQBPAGIAagBlAGMAdAA...`,
      `09:12:53 Sysmon 3 Network connection. Image: powershell.exe  DestIP: 203.0.113.77  DestPort: 443`,
      `09:13:10 Security 4688 Process create. NewProcess: notepad.exe  ParentProcess: explorer.exe`,
      `09:13:35 Sysmon 11 File create. Image: powershell.exe  TargetFilename: C:\\Users\\kwilson\\AppData\\Roaming\\svc_update.exe`,
      `09:20:02 Windows Update Client: Installed update KB5041585.`
    ],
    answer: 2,
    explanation: 'Word opened a macro-enabled document from the Temp folder, then started PowerShell hidden with an encoded command. Office apps rarely start PowerShell on their own. Isolate the laptop and block the connection to 203.0.113.77.',
    hint: 'Look for an Office app starting a shell, not just opening a file.',
    walkthrough: [
      'Outlook opened a document from the Temp folder, which is where attachments are stored.',
      'Word then started PowerShell hidden with an encoded command. Office should never do that.',
      'PowerShell connected to an outside IP on port 443 and wrote a new executable.',
      'Isolate the laptop, block 203.0.113.77, and search other mailboxes for the same attachment.'
    ]
  },
  {
    id: 3,
    title: 'Fake Update Task',
    topic: 'Persistence',
    difficulty: 'Medium',
    severity: 'Medium',
    attack: 'T1053.005',
    attackName: 'Scheduled Task',
    scenario: 'A server admin asks why a new scheduled task appeared on PRINT01 overnight. Review the task and logon events from the last 24 hours.',
    lines: [
      `22:14:02 Security 4624 Successful logon. Account: svc_print  Logon type: 5  Source: services.exe`,
      `22:32:10 Print Service: Job 4411 completed on HP-LaserJet-3F.`,
      `23:04:37 Security 4698 Scheduled task created. TaskName: \\Microsoft\\Windows\\UpdateCheck  Subject: svc_print  Command: C:\\ProgramData\\Intel\\upd.exe`,
      `23:20:00 Windows Defender: Scan completed. No threats found.`,
      `01:00:02 Print Service: Job 4412 completed on HP-LaserJet-3F.`
    ],
    answer: 2,
    explanation: 'A task named to look like a Windows update runs a file from ProgramData, and a print service account created it. Print accounts should never create tasks. Disable the task, hash upd.exe, and check where svc_print logged on.',
    hint: 'Compare the task name and its command with real Windows tasks, and ask which account created it.',
    walkthrough: [
      'A print service account created a scheduled task. Service accounts rarely create tasks.',
      'The task name imitates Windows Update, and its command runs a file from ProgramData.',
      'A clean antivirus scan does not rule out persistence. Check the task itself.',
      'Disable the task, hash upd.exe, and look for the same task name on other hosts.'
    ]
  },
  {
    id: 4,
    title: 'Same Admin, Many Hosts',
    topic: 'Lateral movement',
    difficulty: 'Hard',
    severity: 'High',
    attack: 'T1569.002',
    attackName: 'Service Execution',
    scenario: 'The SOC flagged a backup administrator account. Review the logons and service installs on the three hosts named in the alert.',
    lines: [
      `10:21:58 Security 4624 Successful logon. Account: adm_backup  Logon type: 3  Source IP: 10.0.2.15  Target: FS01`,
      `10:22:14 Security 4624 Successful logon. Account: adm_backup  Logon type: 3  Source IP: 10.0.2.15  Target: HR-DB02`,
      `10:22:19 System 7036 The Backup Agent service entered the running state.`,
      `10:22:31 Security 4624 Successful logon. Account: adm_backup  Logon type: 3  Source IP: 10.0.2.15  Target: WS-114`,
      `10:22:40 System 7045 A service was installed. Service Name: PSEXESVC  Image: %SystemRoot%\\PSEXESVC.exe  Account: adm_backup  Host: WS-114`,
      `10:23:05 Sysmon 1 Process create. Image: C:\\Windows\\PSEXESVC.exe  ParentImage: services.exe  Host: WS-114`

    answer: 4,
    explanation: 'PSEXESVC is a remote execution service, so this install means someone ran commands on WS-114 remotely. Together with three quick logons from the same IP, this looks like lateral movement, not backup work.',
    hint: 'Remote execution usually leaves a service install on the target machine.',
    walkthrough: [
      'One backup admin account logged on to three hosts within about 30 seconds.',
      'PSEXESVC was installed on WS-114, a classic sign of remote command execution.',
      'The process start shows the service running commands on the workstation.',
      'Disable the account, check the source 10.0.2.15, and review what ran on each host.'
    ]
  },
  {
    id: 5,
    title: 'Self-Promotion',
    topic: 'Privilege escalation',
    difficulty: 'Medium',
    severity: 'High',
    attack: 'T1098',
    attackName: 'Account Manipulation',
    scenario: 'A helpdesk account opened a ticket about slow logons. Review the account and group membership changes on the domain controller.',
    lines: [
      `11:02:17 Security 4724 Password reset attempted. Subject: CORP\\helpdesk_t2  Target: CORP\\jlee`,
      `11:02:18 Security 4738 User account changed. Target: CORP\\jlee  Subject: CORP\\helpdesk_t2`,
      `11:30:44 Security 4624 Successful logon. Account: temp_helpdesk  Logon type: 2  Workstation: HD-07`,
      `11:41:15 Security 4732 A member was added to a security-enabled local group. Member: CORP\\temp_helpdesk  Group: Administrators  Subject: CORP\\temp_helpdesk`,
      `11:41:30 Security 4672 Special privileges assigned to new logon. Account: temp_helpdesk`,
      `12:00:00 Windows Update Client: Installed update KB5041585.`
    ],
    answer: 3,
    explanation: 'temp_helpdesk added itself to the local Administrators group. Helpdesk accounts do not change admin groups for themselves. Remove the membership and review everything this account did afterward.',

    walkthrough: [

      'Then the same account added itself to the local Administrators group.',
      'Helpdesk accounts do not need to change admin groups. This is privilege escalation.',
      'Remove the membership, reset the account, and review its activity since the change.'
    ]
  },
  {
    id: 6,
    title: 'Memory Dump',
    topic: 'Credential access',
    difficulty: 'Hard',
    severity: 'Critical',
    attack: 'T1003.001',
    attackName: 'LSASS Memory',
    scenario: 'EDR raised an alert on FIN-LAPTOP-22. Review the process activity from the 15 minutes before the alert.',
    lines: [

      `14:02:47 Sysmon 1 Process create. Image: C:\\Windows\\System32\\rundll32.exe  ParentImage: cmd.exe  CommandLine: rundll32.exe C:\\Windows\\System32\\comsvcs.dll, MiniDump 648 C:\\Temp\\d.bin full`,

    ],
    answer: 1,
    explanation: 'rundll32 calling the MiniDump export of comsvcs.dll to write lsass.exe memory to a file is a known credential-dumping method. The dump can expose password hashes. Treat the laptop as compromised and reset credentials used on it.',

      'rundll32 calling the MiniDump export of comsvcs.dll wrote a memory dump of the LSASS process.',
      'Sysmon shows rundll32 opening lsass.exe with full access (0x1FFFFF).',
      'Treat the laptop as compromised. Reset passwords used on it and review every host it logged on to.'
    ]
  },
  {
    id: 7,

    severity: 'High',
    attack: 'T1567.002',
    attackName: 'Exfiltration to Cloud Storage',
    scenario: 'Finance reports that FS01 slowed down yesterday afternoon. Review file access and process events for that time.',

      `16:02:11 Security 4663 File access. Account: CORP\\dmiller  Object: \\\\FS01\\Finance\\Payroll\\2026\\  Access: ReadData`,
      `16:04:30 Security 4663 File access. Account: CORP\\dmiller  Object: \\\\FS01\\Finance\\Vendors\\  Access: ReadData`,

function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (arr, r) => arr[Math.floor(r() * arr.length)];
function shuffle(arr, r) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
const clock = s => [3600, 60, 1].map((n, i) => String(Math.floor(s / n) % (i ? 60 : 24)).padStart(2, '0')).join(':');

// The event a line belongs to, e.g. "Sysmon 1" or "Security 4624" or "IIS".
function sourceOf(text) {
  const body = text.replace(/^\d{2}:\d{2}:\d{2}\s+/, '');
  const m = body.match(/^(Sysmon|Security|System|Windows Defender|Kernel-PnP)\s+(\d{1,4})\b/);
  return m ? `${m[1]} ${m[2]}` : body.split(/[\s:]/)[0];
}

function generateCase(seed) {
  const r = makeRng(seed);
  const tpl = pick(GEN_TEMPLATES, r);
  const host = pick(GEN_HOSTS, r);
  const t = 8 * 3600 + Math.floor(r() * 8 * 3600);
  const attack = tpl.build(r, t);
  const noise = Array.from({ length: 2 + Math.floor(r() * 3) }, () => ({
    s: 8 * 3600 + Math.floor(r() * 9 * 3600),
    text: pick(GEN_NOISE, r)(r, GEN_USERS)
  }));
  const events = [...attack.events, ...noise].sort((a, b) => a.s - b.s);
  return {
    id: `gen-${seed}`,
    generated: true,
    title: `${pick(tpl.titles, r)} #${1000 + (seed % 9000)}`,
    topic: tpl.topic,
    difficulty: tpl.difficulty,
    severity: tpl.severity,
    attack: tpl.attack,
    attackName: tpl.attackName,
    scenario: `An alert fired on ${host}. Review the Security and endpoint logs for the working day.`,
    lines: events.map(e => `${clock(e.s)} ${e.text}`),
    answer: events.findIndex(e => e.turn),
    explanation: attack.explanation,
    hint: tpl.hint,
    walkthrough: tpl.walkthrough
  };
}

let communityCases = [];

function isValidCommunityCase(c) {
  return !!c && typeof c === 'object'
    && /^c-[a-z0-9-]{3,40}$/.test(c.id)
    && !PUZZLES.some(p => keyOf(p) === c.id)
    && typeof c.title === 'string' && c.title.length > 0 && c.title.length <= 60
    && TOPICS.includes(c.topic)
    && DIFFICULTIES.includes(c.difficulty)
    && SEVERITIES.includes(c.severity)
    && typeof c.scenario === 'string' && c.scenario.length <= 400
    && Array.isArray(c.lines) && c.lines.length >= 4 && c.lines.length <= 30
    && c.lines.every(l => typeof l === 'string' && l.length <= 300 && /^\d{2}:\d{2}:\d{2}\s/.test(l))
    && Number.isInteger(c.answer) && c.answer >= 0 && c.answer < c.lines.length
    && typeof c.explanation === 'string' && c.explanation.length <= 500
    && typeof c.hint === 'string' && c.hint.length <= 200
    && /^T\d{4}(\.\d{3})?$/.test(c.attack)
    && typeof c.attackName === 'string' && c.attackName.length <= 80
    && Array.isArray(c.walkthrough) && c.walkthrough.length >= 2 && c.walkthrough.length <= 5
    && c.walkthrough.every(s => typeof s === 'string' && s.length <= 300);
}

function allCases() {
  return [...PUZZLES, ...communityCases];
}

function findCase(key) {
  if (/^gen-\d{1,10}$/.test(key)) return generateCase(Number(key.slice(4)));
  return allCases().find(c => keyOf(c) === key) || null;
}

function loadState() {
  const fresh = defaultState();

    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!saved || typeof saved !== 'object') return fresh;
    const dict = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const isCount = n => Number.isInteger(n) && n >= 0 && n <= 1000000;
    const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    const dailyKeys = new Map(PUZZLES.map(c => [keyOf(c), c]));

    for (const [k, r] of Object.entries(dict(saved.results))) {
      if (KEY_RE.test(k) && r && isCount(r.attempts) && isCount(r.correct) && r.correct <= r.attempts) {
        fresh.results[k] = { attempts: r.attempts, correct: r.correct };
      }
    }
    for (const [day, d] of Object.entries(dict(saved.daily))) {
      const c = d && dailyKeys.get(d.caseId);
      if (isDay(day) && c && typeof d.correct === 'boolean' && isCount(d.picked) && d.picked < c.lines.length) {
        fresh.daily[day] = { caseId: d.caseId, picked: d.picked, correct: d.correct };
      }
    }
    for (const [k, text] of Object.entries(dict(saved.notes))) {
      if (KEY_RE.test(k) && typeof text === 'string') fresh.notes[k] = text.slice(0, NOTE_MAX);
    }
    for (const [k, p] of Object.entries(dict(saved.points))) {
      if (KEY_RE.test(k) && isCount(p) && p <= POINTS_SOLVE) fresh.points[k] = p;
    }
    for (const [k, v] of Object.entries(dict(saved.bonus))) {
      if (KEY_RE.test(k) && v === true) fresh.bonus[k] = true;
    }
    for (const [k, v] of Object.entries(dict(saved.hints))) {
      if (KEY_RE.test(k) && v === true) fresh.hints[k] = true;
    }
    for (const [code, a] of Object.entries(dict(saved.assignments))) {
      if (/^[A-Za-z0-9_-]{4,4000}$/.test(code) && a && typeof a.name === 'string' && a.name.length <= 60
        && Array.isArray(a.keys) && a.keys.length > 0 && a.keys.length <= 20 && a.keys.every(k => KEY_RE.test(k))) {
        fresh.assignments[code] = { name: a.name, keys: a.keys };
      }
    }
    if (isCount(saved.streak)) fresh.streak = saved.streak;
    if (isCount(saved.bestStreak)) fresh.bestStreak = saved.bestStreak;
    if (isDay(saved.lastDaily)) fresh.lastDaily = saved.lastDaily;
  } catch (e) {
    // Storage is blocked or the saved data is unreadable. Start fresh.
  }
  return fresh;
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    // Storage is blocked. The game still works for this visit.
  }
}

// ---------- dates, streaks, stats ----------

function dateKey(d = new Date()) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}

function dailyCase(key) {
  const [y, m, d] = key.split('-').map(Number);
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2026, 0, 1)) / DAY_MS);
  return PUZZLES[((days % PUZZLES.length) + PUZZLES.length) % PUZZLES.length];
}

function currentStreak() {
  const today = dateKey();
  return state.lastDaily === today || state.lastDaily === yesterdayKey() ? state.streak : 0;
}

function totalPoints() {
  const solvePoints = Object.values(state.points).reduce((sum, p) => sum + p, 0);
  return solvePoints + Object.keys(state.bonus).length * POINTS_DETECTION;
}

function getStats() {
  const entries = Object.entries(state.results);
  const results = entries.map(([, r]) => r);
  const attempts = results.reduce((sum, r) => sum + r.attempts, 0);
  const correct = results.reduce((sum, r) => sum + r.correct, 0);
  const solvedKeys = entries.filter(([, r]) => r.correct > 0).map(([k]) => k);
  const assignmentDone = Object.values(state.assignments).some(a =>
    a.keys.every(k => (state.results[k] || {}).correct > 0));
  return {
    solved: solvedKeys.length,
    builtInSolved: PUZZLES.filter(c => solvedKeys.includes(keyOf(c))).length,
    generatedSolved: solvedKeys.filter(k => k.startsWith('gen-')).length,
    attempts,
    correct,
    accuracy: attempts ? Math.floor((correct / attempts) * 100 + 0.5) : 0,
    streak: currentStreak(),
    bestStreak: state.bestStreak,
    points: totalPoints(),
    detections: Object.keys(state.bonus).length,
    assignmentDone
  };
}

// ---------- answering ----------

function recordAttempt(c, picked, daily) {
  const key = keyOf(c);
  const correct = picked === c.answer;
  const r = state.results[key] || { attempts: 0, correct: 0 };
  const firstWin = correct && r.correct === 0;
  r.attempts += 1;
  if (correct) r.correct += 1;
  state.results[key] = r;
  if (firstWin) state.points[key] = state.hints[key] ? POINTS_SOLVE - POINTS_HINT_PENALTY : POINTS_SOLVE;

  const today = dateKey();
  if (daily && !state.daily[today]) {
    state.daily[today] = { caseId: key, picked, correct };
    state.streak = state.lastDaily === yesterdayKey() ? state.streak + 1 : 1;
    state.lastDaily = today;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  }
  saveState();
}

// A detection rule: an event source plus text that must appear in the line.
// It passes if it finds the turning-point line and at most two other lines.
function checkDetection(c, source, contains) {
  const needle = contains.trim().toLowerCase();
  if (!source || needle.length < 3) {
    return { ok: false, hits: [], reason: 'Pick a source and type at least 3 characters that appear in the turning-point line.' };
  }
  const hits = c.lines
    .map((text, i) => ({ text, i }))
    .filter(({ text }) => sourceOf(text) === source && text.toLowerCase().includes(needle));
  if (!hits.some(h => h.i === c.answer)) {
    return { ok: false, hits, reason: 'Your rule does not match the turning-point line.' };
  }
  if (hits.length > 3) {
    return { ok: false, hits, reason: `Too broad: it matches ${hits.length} lines. Make it more specific.` };
  }
  return { ok: true, hits, reason: 'Good rule: it finds the turning point and at most two other lines.' };
}

// ---------- sharing and printing ----------

function shareText() {
  const cells = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const rec = state.daily[dateKey(d)];
    cells.push(rec ? (rec.correct ? '✅' : '❌') : '⬜');
  }
  const lines = [
    `LogHunt ${dateKey()}`,
    cells.join(''),
    `Streak ${currentStreak()} · Points ${totalPoints()}`
  ];
  if (location.protocol.startsWith('http')) lines.push(location.href.split('#')[0]);
  return lines.join('\n');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    return false;

}

function downloadNotes() {
  const sections = Object.keys(state.notes)
    .filter(k => (state.notes[k] || '').trim())
    .map(k => {
      const title = (findCase(k) || { title: `Case ${k}` }).title;
      return `${title}\n${'-'.repeat(title.length)}\n${state.notes[k].trim()}\n`;
    });
  const blob = new Blob([`LogHunt notes\n\n${sections.join('\n')}`], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `loghunt-notes-${dateKey()}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Assignment codes hold a name and a list of case keys. They are not secret.
function encodeCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeCode(code) {
  const b64 = code.trim().replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
}

function openCase(key, daily) {
  const c = findCase(key);

  const today = state.daily[dateKey()];
  if (daily && today && today.caseId === key) {
    player = { key, daily: true, picked: today.picked, submitted: true };
  } else {
    player = { key, daily, picked: null, submitted: false };
  }
  labState = { q: '', source: '', timeline: false };

  render();
  window.scrollTo(0, 0);
}

function submitAnswer() {
  if (!player || player.submitted || player.picked === null) return;
  const c = findCase(player.key);
  recordAttempt(c, player.picked, player.daily);
  player.submitted = true;
  render();
}

function renderLogBody(c) {
  const q = labState.q.trim().toLowerCase();
  const visible = c.lines
    .map((text, i) => ({ text, i }))
    .filter(({ text }) => (!labState.source || sourceOf(text) === labState.source) && (!q || text.toLowerCase().includes(q)));
  if (!visible.length) return '<p class="muted small">No lines match your search.</p>';
  let timeline = '';
  if (labState.timeline) {
    const buckets = new Map();
    visible.forEach(({ text }) => {
      const minute = text.slice(0, 5);
      buckets.set(minute, (buckets.get(minute) || 0) + 1);
    });
    const max = Math.max(...buckets.values());
    timeline = `<div class="timeline" aria-label="Events per minute">${[...buckets].map(([m, n]) => `<div class="tl-row"><span>${esc(m)}</span><span class="tl-bar"><span style="width:${Math.round((n / max) * 100)}%"></span></span><span>${n}</span></div>`).join('')}</div>`;
  }
  const lines = visible.map(({ text, i }) => {
    let cls = 'line';
    if (player.submitted) {
      if (i === c.answer) cls += ' correct';
      else if (i === player.picked) cls += ' wrong';
    } else if (i === player.picked) {
      cls += ' selected';
    }
    return `<button type="button" class="${cls}" data-action="pick" data-line="${i}"${player.submitted ? ' disabled' : ''}><span class="ln">${i + 1}</span><span class="txt">${esc(text)}</span></button>`;
  }).join('');
  return timeline + lines;
}

  if (!player.submitted) {
    actions += `<button type="button" class="btn primary" data-action="submit"${player.picked === null ? ' disabled' : ''}>Submit answer</button>`;
    if (!solvedBefore && !hinted) actions += `<button type="button" class="btn" data-action="hint">Show hint (-${POINTS_HINT_PENALTY} points)</button>`;
  } else if (!player.daily) {
    actions += '<button type="button" class="btn" data-action="retry">Try again</button>';
  }

  const eyebrow = player.daily ? 'Today\'s case' : c.community ? 'Community case' : c.generated ? 'Random case' : 'Practice';
  return `<section class="card">
    <button type="button" class="link" data-action="close">← Back</button>
    <p class="eyebrow">${esc(eyebrow)}</p>
    <h1>${esc(c.title)}</h1>
    <div class="chips">${chips(c)}<span class="tag">${esc(c.attack)}</span></div>
    <p>${esc(c.scenario)}</p>
    <div class="lab">
      <input type="search" data-lab-search placeholder="Search the log" aria-label="Search the log" value="${esc(labState.q)}">
      <select data-lab-source aria-label="Filter by event source">${sourceOptions}</select>
      <button type="button" class="btn small" data-action="toggle-timeline" aria-pressed="${labState.timeline}">${labState.timeline ? 'Hide timeline' : 'Show timeline'}</button>
    </div>
    <div class="log" id="log-box" role="group" aria-label="Log lines">${renderLogBody(c)}</div>
    ${body}
    <div class="actions">${actions}</div>
    <h2>Your notes</h2>
    <textarea data-note-id="${esc(key)}" maxlength="${NOTE_MAX}" placeholder="Write what you noticed. Saved in this browser." aria-label="Notes for this case">${esc(state.notes[key] || '')}</textarea>
  </section>`;
}

function detectionBuilder(c, key) {
  if (state.bonus[key]) {
    return `<p class="result good">Detection rule saved: +${POINTS_DETECTION} points.</p>`;
  }
  const sources = [...new Set(c.lines.map(sourceOf))];
  const test = detectDraft.result;
  const verdict = test ? `<p class="${test.ok ? 'good' : 'bad'} small">${esc(test.reason)} Matches ${test.hits.length} line(s).</p>` : '';
  return `<section class="detect">
    <h2>Bonus: write a detection rule (+${POINTS_DETECTION} points)</h2>
    <p class="small muted">Write the simplest rule that would have caught this attack: an event source, and text that appears in the attack line. The check passes if it finds the turning point and at most two other lines.</p>
    <label class="field"><span>Event source</span>
      <select data-detect-source><option value="">Choose a source</option>${sources.map(s => `<option value="${esc(s)}"${detectDraft.source === s ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>
    </label>
    <label class="field"><span>Text that must appear in the line (at least 3 characters)</span>
      <input class="text-input" type="text" maxlength="80" data-detect-contains value="${esc(detectDraft.contains)}">
    </label>
    <div class="actions">
      <button type="button" class="btn" data-action="test-detection">Test rule</button>
      <button type="button" class="btn primary" data-action="save-detection">Save rule</button>
    </div>
    ${verdict}
  </section>`;
}

const VIEWS = {
  today: viewToday,
  practice: viewPractice,
  classroom: viewClassroom,
  friends: viewFriends,
  team: viewTeam,
  progress: viewProgress,
  notes: viewNotes
};

function render() {
  document.querySelectorAll('nav [data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  const message = flash ? `<p class="flash" role="status">${esc(flash)}</p>` : '';
  flash = '';
  if (player && !findCase(player.key)) player = null;
  app.innerHTML = message + (player ? viewPlayer() : VIEWS[currentView]());
}

// ---------- events ----------

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-view], [data-action]');
  if (!el) return;
  if (el.dataset.view) {
    currentView = el.dataset.view;
    player = null;
    render();
    window.scrollTo(0, 0);
    return;
  }
  switch (el.dataset.action) {
    case 'open-case': openCase(el.dataset.id, el.dataset.daily === '1'); break;
    case 'pick': player.picked = Number(el.dataset.line); render(); break;
    case 'submit': submitAnswer(); break;
    case 'retry': player.picked = null; player.submitted = false; detectDraft = { source: '', contains: '' }; render(); break;
    case 'close': player = null; render(); break;
    case 'hint':
      state.hints[player.key] = true;
      saveState();
      render();
      break;
    case 'new-random':
      openCase(`gen-${1 + Math.floor(Math.random() * 999999998)}`, false);
      break;
    case 'toggle-timeline':
      labState.timeline = !labState.timeline;
      render();
      break;
    case 'test-detection': {
      detectDraft.result = checkDetection(findCase(player.key), detectDraft.source, detectDraft.contains);
      render();
      break;
    }
    case 'save-detection': {
      const result = checkDetection(findCase(player.key), detectDraft.source, detectDraft.contains);
      detectDraft.result = result;
      if (result.ok) {
        state.bonus[player.key] = true;
        saveState();
        note(`Detection rule saved: +${POINTS_DETECTION} points.`);
      } else {
        render();
      }
      break;
    }
    case 'copy-share':
      note((await copyText(shareText())) ? 'Share card copied.' : 'Could not copy. Select the card text and copy it by hand.');
      break;
    case 'download-notes': downloadNotes(); break;
    case 'join-code': {
      try {
        const data = decodeCode(joinDraft);
        if (typeof data.n !== 'string' || !Array.isArray(data.k) || !data.k.length || !data.k.every(k => KEY_RE.test(String(k)))) throw new Error('bad');
        const code = joinDraft.trim();
        state.assignments[code] = { name: data.n.slice(0, 60), keys: data.k.slice(0, 20).map(String) };
        saveState();
        joinDraft = '';
        note(`Assignment "${state.assignments[code].name}" added.`);
      } catch (err) {
        note('That code is not valid. Check it and try again.');
      }
      break;
    }
    case 'start-assignment': {
      const a = state.assignments[el.dataset.code];
      if (!a) return;
      const next = a.keys.find(k => !((state.results[k] || {}).correct > 0) && findCase(k)) || a.keys.find(k => findCase(k));
      if (next) openCase(next, false);
      else note('None of these cases are available yet.');
      break;
    }
    case 'print-assignment': {
      const a = state.assignments[el.dataset.code];
      if (a) printKeys(a.keys, a.name);
      break;
    }
    case 'remove-assignment':
      delete state.assignments[el.dataset.code];
      saveState();
      render();
      break;
    case 'create-code': {
      if (!teacherDraft.picks.length) return note('Pick at least one case first.');
      const name = (teacherDraft.name.trim() || 'Untitled assignment').slice(0, 60);
      createdCode = encodeCode({ n: name, k: teacherDraft.picks });
      state.assignments[createdCode] = { name, keys: teacherDraft.picks.slice(0, 20) };
      saveState();
      render();
      break;
    }
    case 'print-picks':
      if (!teacherDraft.picks.length) return note('Pick at least one case first.');
      printKeys(teacherDraft.picks, teacherDraft.name.trim() || 'LogHunt worksheet');
      break;
    case 'copy-code':
      note((await copyText(createdCode)) ? 'Code copied.' : 'Could not copy. Select the code and copy it by hand.');
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) {
    if (!Object.prototype.hasOwnProperty.call(filters, t.dataset.filter)) return;
    filters[t.dataset.filter] = t.value;
    render();
  } else if (t.dataset.labSource !== undefined) {
    labState.source = t.value;
    document.getElementById('log-box').innerHTML = renderLogBody(findCase(player.key));
  } else if (t.dataset.detectSource !== undefined) {
    detectDraft.source = t.value;
    detectDraft.result = null;
  } else if (t.dataset.pickCase !== undefined) {
    const key = t.dataset.pickCase;
    teacherDraft.picks = t.checked
      ? [...new Set([...teacherDraft.picks, key])]
      : teacherDraft.picks.filter(k => k !== key);
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.noteId !== undefined) {
    if (!KEY_RE.test(t.dataset.noteId)) return;
    state.notes[t.dataset.noteId] = t.value.slice(0, NOTE_MAX);
    saveState();
  } else if (t.dataset.labSearch !== undefined) {
    labState.q = t.value;
    document.getElementById('log-box').innerHTML = renderLogBody(findCase(player.key));
  } else if (t.dataset.detectContains !== undefined) {
    detectDraft.contains = t.value;
    detectDraft.result = null;
  } else if (t.dataset.teacherName !== undefined) {
    teacherDraft.name = t.value;
  } else if (t.dataset.joinCode !== undefined) {
    joinDraft = t.value;
  }
});

// ---------- start up ----------

fetch('community/cases/index.json', { cache: 'no-cache' })
  .then(res => (res.ok ? res.json() : []))
  .then(list => {
    if (!Array.isArray(list)) return;
    communityCases = list.filter(isValidCommunityCase).map(c => ({ ...c, community: true }));
    if (!player && (currentView === 'practice' || currentView === 'classroom')) render();
  })
  .catch(() => {});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
