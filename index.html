<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c121b">
<meta name="description" content="A daily cybersecurity puzzle. Read simulated Windows-style logs and find the line that shows the attack.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap">
<title>LogHunt</title>
<style>
:root {
  --bg: #0c121b;
  --panel: #131c2a;
  --panel-2: #1a2535;
  --panel-3: #0f1724;
  --border: #25324a;
  --text: #eef3fa;
  --muted: #93a1b8;
  --faint: #66768f;
  --accent: #86e9c2;
  --accent-ink: #052117;
  --accent-soft: rgba(134, 233, 194, 0.12);
  --good: #4ade9a;
  --bad: #ff7a7a;
  --warn: #f6c453;
  --blue: #7cc4ff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: Archivo, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: 80px; }
a { color: var(--accent); text-decoration: underline; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: rgba(12, 18, 27, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; cursor: pointer; text-decoration: none; }
.brand svg { color: var(--accent); }
.dot { color: var(--accent); }
nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; justify-content: center; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button {
  background: transparent;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}
nav button:hover { color: var(--text); }
nav button.active { background: var(--accent); color: var(--accent-ink); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }

main { max-width: 1120px; margin: 0 auto; padding: 24px 18px 40px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
.card.accent { border-color: rgba(134, 233, 194, 0.45); background: linear-gradient(180deg, #132a25, #131c2a); }
.stack { display: grid; gap: 16px; }
.split { display: grid; gap: 16px; }
@media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; align-items: start; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.eyebrow.muted { color: var(--faint); }
h1 { font-family: var(--display); font-size: clamp(32px, 6vw, 48px); line-height: 1.05; letter-spacing: -0.02em; margin: 6px 0 10px; font-weight: 900; }
h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 12px; font-weight: 800; }
h3 { font-size: 16px; margin: 0 0 8px; font-weight: 700; }
.accent-text { color: var(--accent); }
.lead { color: var(--muted); margin: 0 0 18px; font-size: 17px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.flash { color: var(--accent); font-weight: 600; margin: 0 0 14px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); border-color: rgba(255, 122, 122, 0.5); background: transparent; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
.linkrow { display: flex; justify-content: flex-end; margin-top: 14px; }

.chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; background: var(--panel-2); color: var(--muted); }
.chip.lv { background: rgba(134, 233, 194, 0.14); color: var(--accent); }
.chip.sev-Low { background: rgba(124, 196, 255, 0.14); color: var(--blue); }
.chip.sev-Medium { background: rgba(246, 196, 83, 0.14); color: var(--warn); }
.chip.sev-High { background: rgba(255, 122, 122, 0.13); color: var(--bad); }
.chip.sev-Critical { background: rgba(255, 122, 122, 0.25); color: #ffb3b3; }
.tag { font-family: var(--mono); font-size: 12px; color: var(--accent); border: 1px solid rgba(134, 233, 194, 0.5); border-radius: 6px; padding: 1px 7px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.pill.good { background: var(--accent-soft); color: var(--accent); }

/* Today */
.hero { padding: 14px 0 6px; }
.hero h1 { margin-top: 2px; }
.puzzle-icon { width: 56px; height: 56px; border-radius: 14px; background: var(--panel-2); display: grid; place-items: center; color: var(--accent); margin: 14px 0; }
.puzzle-title { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.15; margin: 0 0 8px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0; }
select, input[type="search"], input[type="text"], input[type="password"], textarea {
  background: var(--panel-3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font: inherit;
  font-size: 15px;
}
select { cursor: pointer; }
.search { width: 100%; margin: 14px 0; }
.text-input { width: 100%; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
.streak-num { font-family: var(--display); font-size: 56px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; margin: 6px 0; }
.streak-num span { font-size: 56px; }
.streak-num small { font-size: 22px; font-weight: 800; margin-left: 6px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0 8px; text-align: center; }
.wk-l { display: block; font-size: 12px; font-weight: 700; color: var(--faint); margin-bottom: 6px; }
.wk-c { display: block; width: 30px; height: 30px; margin: 0 auto; border-radius: 50%; background: var(--panel-2); color: var(--accent-ink); line-height: 30px; font-weight: 800; }
.wk-c.on { background: var(--accent); }
.queue { list-style: none; padding: 0; margin: 0; }
.queue li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--border); }
.queue li:first-child { border-top: 0; }
.queue .qt { font-weight: 700; }
.queue .qm { color: var(--muted); font-size: 14px; }
.tip { display: block; }

/* Practice */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
.filters .field { margin: 0; }
.filters select { width: 100%; }
.case-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 12px; }
.case-item {
  width: 100%;
  display: grid;
  gap: 8px;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  font: inherit;
  padding: 18px 20px;
  cursor: pointer;
}
.case-item:hover { border-color: var(--accent); }
.ci-top { display: flex; gap: 6px; flex-wrap: wrap; }
.ci-title { font-size: 19px; font-weight: 800; }
.ci-desc { color: var(--muted); font-size: 14px; }
.ci-meta { color: var(--faint); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ci-action { color: var(--accent); font-weight: 700; justify-self: end; font-size: 14px; }

/* Case screen */
.case-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.timer { font-family: var(--mono); font-weight: 700; border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; background: var(--panel-3); }
.step-l { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.step-l strong { color: var(--text); }
.theories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.opt { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
.cat { background: var(--panel-2); color: var(--muted); border: 1px solid transparent; border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.cat.on { background: var(--text); color: var(--bg); }
.lab-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lab-tools input[type="search"] { flex: 1 1 220px; min-width: 0; }
.count { color: var(--faint); font-size: 13px; margin: 8px 0; }

.log { font-family: var(--mono); font-size: 13.5px; background: var(--panel-3); border: 1px solid var(--border); border-radius: 14px; padding: 6px; margin: 8px 0 14px; }
.line {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--text);
  font: inherit;
  padding: 10px 10px;
  cursor: pointer;
}
.line + .line { border-top: 1px solid rgba(37, 50, 74, 0.6); border-radius: 0; }
.line:hover:not(:disabled) { background: var(--panel-2); }
.line.selected { border-color: var(--accent); background: var(--accent-soft); }
.line.correct { border-color: var(--good); background: rgba(74, 222, 154, 0.12); }
.line.wrong { border-color: var(--bad); background: rgba(255, 122, 122, 0.12); }
.line:disabled { cursor: default; }
.ln { color: var(--faint); text-align: right; user-select: none; }
.ts { color: var(--faint); margin-right: 8px; }
.src { color: var(--accent); font-weight: 600; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.timeline { border-bottom: 1px solid var(--border); margin-bottom: 8px; padding: 4px 8px 10px; }
.tl-row { display: grid; grid-template-columns: 52px 1fr 28px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
.tl-bar { background: var(--panel-2); border-radius: 999px; height: 8px; overflow: hidden; }
.tl-bar span { display: block; height: 100%; background: var(--accent); }

.casefile dl { display: grid; grid-template-columns: 1fr; margin: 0; }
.casefile .row-kv { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.casefile .row-kv:first-of-type { border-top: 0; }
.casefile dt { color: var(--muted); }
.casefile dd { margin: 0; font-weight: 700; text-align: right; }
.ips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ip { font-family: var(--mono); font-size: 12px; color: var(--blue); border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; }

.how .small { margin: 0 0 12px; }
.how .actions { display: grid; gap: 10px; margin-top: 12px; }
.hint { border-left: 3px solid var(--warn); background: rgba(246, 196, 83, 0.08); padding: 10px 14px; border-radius: 10px; margin: 0 0 12px; }
.result strong { font-family: var(--display); font-weight: 800; }
.result { padding: 14px 16px; border-radius: 14px; margin: 16px 0; border: 1px solid; }
.result.good { border-color: var(--good); background: rgba(74, 222, 154, 0.08); }
.result.bad { border-color: var(--bad); background: rgba(255, 122, 122, 0.08); }
.walk { padding-left: 20px; margin: 0; }
.walk li { margin: 8px 0; color: var(--muted); }
.detect { border: 1px dashed var(--accent); border-radius: 16px; padding: 16px; margin-top: 16px; }
.detect .field { margin: 10px 0 0; }
.detect .row { margin-top: 12px; }

/* Progress and friends */
.badges { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.badge { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.badge:first-child { border-top: 0; }
.badge-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; color: var(--faint); flex: none; }
.badge.earned .badge-ico { background: var(--accent-soft); color: var(--accent); }
.badge.locked .b-name { color: var(--muted); }
.b-name { font-weight: 700; }
.b-sub { color: var(--faint); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--panel-3); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.stat .num { font-family: var(--display); display: block; font-size: 30px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
.stat .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.topic-row { margin: 16px 0; }
.topic-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.topic-head span:last-child { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.bar { height: 8px; background: var(--panel-3); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.low span { background: var(--warn); }
table.board, table.results { width: 100%; border-collapse: collapse; }
table.board th, table.board td, table.results th, table.results td { text-align: left; padding: 12px 6px; border-bottom: 1px solid var(--border); }
table.results th { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
table.board tr.me td { color: var(--accent); font-weight: 700; }
.res-ok { color: var(--good); font-weight: 700; }
.res-miss { color: var(--bad); font-weight: 700; }
.table-wrap { overflow-x: auto; }
.share { font-family: var(--mono); background: var(--panel-3); border: 1px solid var(--border); border-radius: 12px; padding: 12px; white-space: pre-wrap; font-size: 14px; margin: 10px 0; }
.code-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.code-row input { font-family: var(--mono); letter-spacing: 0.04em; }
.progress { height: 10px; background: var(--panel-3); border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.team-tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: var(--warn); background: rgba(246, 196, 83, 0.12); border-radius: 7px; padding: 4px 9px; }
.members { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.member { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 600; font-size: 14px; }
.member i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--accent); }
.feed { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.feed li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; }
.feed li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
.feed small { color: var(--faint); display: block; }
.note { border-top: 1px solid var(--border); padding: 14px 0; }
.note pre { white-space: pre-wrap; font-family: var(--sans); margin: 6px 0 4px; color: var(--muted); }
.notes-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.notes-head .field { margin: 0; min-width: 220px; }

.auth { max-width: 520px; margin: 24px auto 0; }
.auth h1 { font-size: clamp(28px, 5vw, 40px); }
.auth form { margin-top: 18px; }
.auth form .field { margin: 0 0 14px; }
.auth-tabs { display: inline-flex; gap: 6px; background: var(--panel-3); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin: 14px 0 6px; }
.auth-tabs button { background: transparent; border: 0; color: var(--muted); font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.auth-tabs button.on { background: var(--accent); color: var(--accent-ink); }
.auth-error { color: var(--bad); font-weight: 600; min-height: 1.5em; margin: 0 0 12px; }
.auth-alt { margin-top: 18px; }
button.avatar { cursor: pointer; padding: 0; color: var(--muted); }
button.avatar:hover { color: var(--text); }
.foot { max-width: 1120px; margin: 0 auto; padding: 0 18px 32px; color: var(--faint); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.foot-fine { font-size: 12px; color: var(--faint); }
#print-area { display: none; }

@media (max-width: 560px) {
  header.top { padding: 12px 14px; }
  .avatar { order: 2; margin-left: auto; }
  nav { order: 3; flex: 0 0 100%; justify-content: flex-start; }
  .queue .link { white-space: nowrap; }
  .kpis { grid-template-columns: 1fr 1fr 1fr; }
  .kpi { padding: 12px; }
  .stat .num { font-size: 24px; }
  .card { padding: 16px; }
  .case-item { padding: 16px; }
}

@media print {
  body * { visibility: hidden !important; }
  #print-area, #print-area * { visibility: visible !important; }
  #print-area {
    display: block !important;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    background: #fff;
    color: #000;
    padding: 0 12px;
  }
  #print-area h1, #print-area h2 { color: #000; }
  #print-area .ws-log { font-family: monospace; font-size: 11px; white-space: pre-wrap; border: 1px solid #999; padding: 6px; }
  .page-break { break-before: page; }
  header.top, footer.foot, .flash { display: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" data-view="today" role="link" tabindex="0" aria-label="LogHunt home">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg>
    <span>LogHunt<span class="dot">.</span></span>
  </a>
  <nav aria-label="Main">
    <button type="button" data-view="today">Today</button>
    <button type="button" data-view="practice">Practice</button>
    <button type="button" data-view="friends">Friends</button>
    <button type="button" data-view="progress">Progress</button>
  </nav>
  <button type="button" class="avatar" data-view="account" aria-label="Account"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</header>
<main id="app"></main>
<div id="print-area"></div>
<footer class="foot"><span class="foot-main">Simulated logs · Learn by investigating</span><span class="foot-fine">All logs are simulated for training. No real systems or people are involved. ATT&amp;CK is a trademark of The MITRE Corporation.</span></footer>
<script>
const PUZZLES = [
  {
    id: 1,
    title: 'Spray and Pray',
    topic: 'Identity',
    difficulty: 'Medium',
    severity: 'High',
    attack: 'T1110.003',
    attackName: 'Password Spraying',
    scenario: 'A help desk ticket says a user got a sign-in alert. Review the Windows Security log from the domain controller for the last hour.',
    lines: [

  const body = text.replace(/^\d{2}:\d{2}:\d{2}\s+/, '');
  const m = body.match(/^(Sysmon|Security|System|Windows Defender|Kernel-PnP)\s+(\d{1,4})\b/);
  return m ? `${m[1]} ${m[2]}` : body.split(/[\s:]/)[0];
}

function categoryOf(text) {
  const src = sourceOf(text);
  if (/^Security (4624|4625|4634|4672|4769)$/.test(src)) return 'Logons';
  if (/^(Security (4698|4724|4732|4738)|System 7045|Sysmon 13)$/.test(src)) return 'Changes';
  if (/^(Sysmon 1|Sysmon 10|Security 4688)$/.test(src)) return 'Processes';
  if (/^(Sysmon 11|Sysmon 23|Security 4663)$/.test(src)) return 'Files';
  if (/^(Sysmon 3|IIS)$/.test(src)) return 'Network';
  return 'Other';
}

function hostsOf(c) {
  const found = new Set();
  c.lines.forEach(line => {
    (line.match(/\b[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+\b|\b[A-Z]{2,}\d{2,3}\b/g) || []).forEach(h => {
      if (/\d/.test(h) && !/^KB/.test(h)) found.add(h);
    });
  });
  return [...found].slice(0, 6);
}

function ipsOf(c) {
  const found = new Set();
  c.lines.forEach(line => (line.match(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g) || []).forEach(ip => found.add(ip)));
  return [...found];
}

function generateCase(seed) {
  const r = makeRng(seed);
  const tpl = pick(GEN_TEMPLATES, r);
  const host = pick(GEN_HOSTS, r);
  const t = 8 * 3600 + Math.floor(r() * 8 * 3600);
  const attack = tpl.build(r, t);
  const noise = Array.from({ length: 2 + Math.floor(r() * 3) }, () => ({
    s: 8 * 3600 + Math.floor(r() * 9 * 3600),
    text: pick(GEN_NOISE, r)(r, GEN_USERS)
  }));
  const events = [...attack.events, ...noise].sort((a, b) => a.s - b.s);
  return {
    id: `gen-${seed}`,
    generated: true,
    title: `${pick(tpl.titles, r)} #${1000 + (seed % 9000)}`,
    topic: tpl.topic,
    difficulty: tpl.difficulty,
    severity: tpl.severity,
    attack: tpl.attack,
    attackName: tpl.attackName,
    scenario: `An alert fired on ${host}. Review the Security and endpoint logs for the working day.`,
    lines: events.map(e => `${clock(e.s)} ${e.text}`),
    answer: events.findIndex(e => e.turn),
    explanation: attack.explanation,
    hint: tpl.hint,
    walkthrough: tpl.walkthrough
  };
}

  'Privilege escalation', 'Credential theft', 'Data theft', 'Ransomware', 'Web shell attack', 'Defense evasion', 'Insider misuse'];

const correctTheory = c => THEORY_OF_TOPIC[c.topic] || 'Stolen account';

function theoryOptions(c) {
  const correct = correctTheory(c);
  const r = makeRng(hashKey(keyOf(c)));
  const others = shuffle(THEORY_POOL.filter(t => t !== correct), r).slice(0, 2);
  return shuffle([correct, ...others], r);
}

// ---------- community cases (loaded from community/cases/index.json) ----------

let communityCases = [];

function isValidCommunityCase(c) {
  return !!c && typeof c === 'object'
    && /^c-[a-z0-9-]{3,40}$/.test(c.id)
    && !PUZZLES.some(p => keyOf(p) === c.id)
    && typeof c.title === 'string' && c.title.length > 0 && c.title.length <= 60
    && TOPICS.includes(c.topic)
    && DIFFICULTIES.includes(c.difficulty)
    && SEVERITIES.includes(c.severity)
    && typeof c.scenario === 'string' && c.scenario.length <= 400
    && Array.isArray(c.lines) && c.lines.length >= 4 && c.lines.length <= 30
    && c.lines.every(l => typeof l === 'string' && l.length <= 300 && /^\d{2}:\d{2}:\d{2}\s/.test(l))
    && Number.isInteger(c.answer) && c.answer >= 0 && c.answer < c.lines.length
    && typeof c.explanation === 'string' && c.explanation.length <= 500
    && typeof c.hint === 'string' && c.hint.length <= 200
    && /^T\d{4}(\.\d{3})?$/.test(c.attack)
    && typeof c.attackName === 'string' && c.attackName.length <= 80
    && Array.isArray(c.walkthrough) && c.walkthrough.length >= 2 && c.walkthrough.length <= 5
    && c.walkthrough.every(s => typeof s === 'string' && s.length <= 300);
}

function allCases() {
  return [...PUZZLES, ...communityCases];
}

function findCase(key) {
  if (/^gen-\d{1,10}$/.test(key)) return generateCase(Number(key.slice(4)));
  return allCases().find(c => keyOf(c) === key) || null;
}

// ---------- saved progress ----------

function defaultState() {
  return {
    results: {}, daily: {}, notes: {}, points: {}, bonus: {}, hints: {}, theoryBonus: {}, history: [],
    assignments: {}, streak: 0, bestStreak: 0, lastDaily: null, inviteCode: ''
  };
}

// Rebuild the saved state from known fields only. Anything unexpected is dropped.
function loadState() {
  const fresh = defaultState();
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey()) || 'null');
    if (!saved || typeof saved !== 'object') return fresh;
    const dict = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const isCount = n => Number.isInteger(n) && n >= 0 && n <= 1000000;
    const isMs = n => Number.isFinite(n) && n >= 0 && n < 4e12;
    const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    const dailyKeys = new Map(PUZZLES.map(c => [keyOf(c), c]));

    for (const [k, r] of Object.entries(dict(saved.results))) {
      if (KEY_RE.test(k) && r && isCount(r.attempts) && isCount(r.correct) && r.correct <= r.attempts) {
        fresh.results[k] = { attempts: r.attempts, correct: r.correct };
      }
    }
    for (const [day, d] of Object.entries(dict(saved.daily))) {
      const c = d && dailyKeys.get(d.caseId);
      if (isDay(day) && c && typeof d.correct === 'boolean' && isCount(d.picked) && d.picked < c.lines.length) {
        fresh.daily[day] = { caseId: d.caseId, picked: d.picked, correct: d.correct };
      }
    }
    for (const [k, text] of Object.entries(dict(saved.notes))) {
      if (KEY_RE.test(k) && typeof text === 'string') fresh.notes[k] = text.slice(0, NOTE_MAX);
    }
    for (const [k, p] of Object.entries(dict(saved.points))) {
      if (KEY_RE.test(k) && isCount(p) && p <= POINTS_SOLVE) fresh.points[k] = p;
    }
    for (const [k, v] of Object.entries(dict(saved.bonus))) {
      if (KEY_RE.test(k) && v === true) fresh.bonus[k] = true;
    }
    for (const [k, v] of Object.entries(dict(saved.hints))) {
      if (KEY_RE.test(k) && v === true) fresh.hints[k] = true;
    }
    for (const [k, v] of Object.entries(dict(saved.theoryBonus))) {
      if (KEY_RE.test(k) && v === true) fresh.theoryBonus[k] = true;
    }
    if (Array.isArray(saved.history)) {
      fresh.history = saved.history
        .filter(h => h && KEY_RE.test(String(h.key)) && typeof h.correct === 'boolean' && isCount(h.points) && isMs(h.at))
        .slice(-HISTORY_MAX)
        .map(h => ({ key: String(h.key), correct: h.correct, points: h.points, at: h.at }));
    }
    for (const [code, a] of Object.entries(dict(saved.assignments))) {
      if (/^[A-Za-z0-9_-]{4,4000}$/.test(code) && a && typeof a.name === 'string' && a.name.length <= 60
        && Array.isArray(a.keys) && a.keys.length > 0 && a.keys.length <= 20 && a.keys.every(k => KEY_RE.test(k))) {
        fresh.assignments[code] = { name: a.name, keys: a.keys };
      }
    }
    if (isCount(saved.streak)) fresh.streak = saved.streak;
    if (isCount(saved.bestStreak)) fresh.bestStreak = saved.bestStreak;
    if (isDay(saved.lastDaily)) fresh.lastDaily = saved.lastDaily;
    if (typeof saved.inviteCode === 'string' && /^LOGHUNT-[A-Z0-9]{4}$/.test(saved.inviteCode)) fresh.inviteCode = saved.inviteCode;
  } catch (e) {
    // Storage is blocked or the saved data is unreadable. Start fresh.
  }
  if (!fresh.inviteCode) fresh.inviteCode = newInviteCode();
  return fresh;
}

// ---------- session ----------
// Guests keep the original progress key. Each account has its own key.

function storageKey() {
  return session ? `${STORE_KEY}.${session}` : STORE_KEY;
}

function newInviteCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(4));
  return 'LOGHUNT-' + Array.from(bytes, b => alphabet[b % alphabet.length]).join('');
}

let session = currentAccount();
let state = loadState();

function saveState() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(state));
  } catch (e) {
    // Storage is blocked. The game still works for this visit.
  }
}

// ---------- accounts on this device ----------
// Accounts are kept in this browser only. Passwords are never stored, only a salted
// PBKDF2 hash. Anyone with access to this browser can still try to guess a password,
// so use a password you do not use anywhere else.

let authMode = 'login';
let authError = '';
let authName = '';

function loadAccounts() {
  try {
    const raw = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || 'null');
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
    const clean = {};
    for (const [name, a] of Object.entries(raw)) {
      if (USERNAME_RE.test(name) && a && typeof a.salt === 'string' && typeof a.hash === 'string'
        && a.salt.length <= 64 && a.hash.length <= 64 && a.iter === PBKDF2_ITERATIONS) {
        clean[name] = { salt: a.salt, hash: a.hash, iter: a.iter, created: Number(a.created) || 0 };
      }
    }
    return clean;
  } catch (e) {
    return {};
  }
}

function saveAccounts(accounts) {
  try {
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
    return true;
  } catch (e) {
    return false;
  }
}

function currentAccount() {
  const name = localStorage.getItem(SESSION_KEY);
  return name && loadAccounts()[name] ? name : null;
}

const toBase64 = bytes => btoa(String.fromCharCode(...bytes));
const fromBase64 = text => Uint8Array.from(atob(text), ch => ch.charCodeAt(0));

async function derivePassword(password, salt) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' }, material, 256);
  return toBase64(new Uint8Array(bits));
}

async function createAccount(name, password) {
  const accounts = loadAccounts();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  accounts[name] = { salt: toBase64(salt), hash: await derivePassword(password, salt), iter: PBKDF2_ITERATIONS, created: Date.now() };
  return saveAccounts(accounts);
}

async function passwordMatches(name, password) {
  const account = loadAccounts()[name];
  if (!account) return false;
  return (await derivePassword(password, fromBase64(account.salt))) === account.hash;
}

function enterAccount(name) {
  localStorage.setItem(SESSION_KEY, name);
  session = name;
  stopTimer();
  player = null;
  state = loadState();
  currentView = 'today';
}

function leaveAccount() {
  localStorage.removeItem(SESSION_KEY);
  session = null;
  stopTimer();
  player = null;
  state = loadState();
  authMode = 'login';
  authError = '';
  currentView = 'login';
}

function chooseGuest() {
  session = null;
  state = loadState();
  currentView = 'today';
}

// ---------- dates, streaks, stats ----------

function dateKey(d = new Date()) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}

function dailyCase(key) {
  const [y, m, d] = key.split('-').map(Number);
  const days = Math.round((Date.UTC(y, m - 1, d) - EPOCH_DAY) / DAY_MS);
  return PUZZLES[((days % PUZZLES.length) + PUZZLES.length) % PUZZLES.length];
}

function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - EPOCH_DAY) / DAY_MS) + 1;
}

function weekDays() {
  const now = new Date();
  const offset = (now.getDay() + 6) % 7;
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(now);
    d.setDate(now.getDate() - offset + i);
    return d;
  });
}

function currentStreak() {
  const today = dateKey();
  return state.lastDaily === today || state.lastDaily === yesterdayKey() ? state.streak : 0;
}

function totalPoints() {
  const solve = Object.values(state.points).reduce((sum, p) => sum + p, 0);
  return solve + Object.keys(state.theoryBonus).length * POINTS_THEORY + Object.keys(state.bonus).length * POINTS_DETECTION;
}

function topicStats() {
  const map = new Map();
  for (const [key, r] of Object.entries(state.results)) {
    const c = findCase(key);
    if (!c || r.attempts === 0) continue;
    const t = map.get(c.topic) || { topic: c.topic, correct: 0, attempts: 0 };
    t.correct += r.correct;
    t.attempts += r.attempts;
    map.set(c.topic, t);
  }
  return [...map.values()].sort((a, b) => a.correct / a.attempts - b.correct / b.attempts);
}

function getStats() {
  const entries = Object.entries(state.results);
  const results = entries.map(([, r]) => r);
  const attempts = results.reduce((sum, r) => sum + r.attempts, 0);
  const correct = results.reduce((sum, r) => sum + r.correct, 0);
  const solvedKeys = entries.filter(([, r]) => r.correct > 0).map(([k]) => k);
  const assignmentDone = Object.values(state.assignments).some(a =>
    a.keys.every(k => (state.results[k] || {}).correct > 0));
  return {
    solved: solvedKeys.length,
    builtInSolved: PUZZLES.filter(c => solvedKeys.includes(keyOf(c))).length,
    generatedSolved: solvedKeys.filter(k => k.startsWith('gen-')).length,
    attempts,
    correct,
    accuracy: attempts ? Math.floor((correct / attempts) * 100 + 0.5) : 0,
    streak: currentStreak(),
    bestStreak: state.bestStreak,
    points: totalPoints(),
    detections: Object.keys(state.bonus).length,
    assignmentDone
  };
}

// ---------- answering ----------

function recordAttempt(c, picked, daily, theoryRight) {
  const key = keyOf(c);
  const correct = picked === c.answer;
  const r = state.results[key] || { attempts: 0, correct: 0 };
  const firstWin = correct && r.correct === 0;
  r.attempts += 1;
  if (correct) r.correct += 1;
  state.results[key] = r;

  let gained = 0;
  if (firstWin) {
    state.points[key] = state.hints[key] ? POINTS_SOLVE - POINTS_HINT_PENALTY : POINTS_SOLVE;
    gained += state.points[key];
  }
  if (theoryRight && !state.theoryBonus[key]) {
    state.theoryBonus[key] = true;
    gained += POINTS_THEORY;
  }

  state.history = [...state.history, { key, correct, points: correct ? (state.points[key] || 0) : 0, at: Date.now() }].slice(-HISTORY_MAX);

  const today = dateKey();
  if (daily && !state.daily[today]) {
    state.daily[today] = { caseId: key, picked, correct };
    state.streak = state.lastDaily === yesterdayKey() ? state.streak + 1 : 1;
    state.lastDaily = today;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
  }
  saveState();
  return { correct, gained };
}

// A detection rule: an event source plus text that must appear in the line.
// It passes if it finds the turning-point line and at most two other lines.
function checkDetection(c, source, contains) {
  const needle = contains.trim().toLowerCase();
  if (!source || needle.length < 3) {
    return { ok: false, hits: [], reason: 'Pick a source and type at least 3 characters that appear in the turning-point line.' };
  }
  const hits = c.lines
    .map((text, i) => ({ text, i }))
    .filter(({ text }) => sourceOf(text) === source && text.toLowerCase().includes(needle));
  if (!hits.some(h => h.i === c.answer)) {
    return { ok: false, hits, reason: 'Your rule does not match the turning-point line.' };
  }
  if (hits.length > 3) {
    return { ok: false, hits, reason: `Too broad: it matches ${hits.length} lines. Make it more specific.` };
  }
  return { ok: true, hits, reason: 'Good rule: it finds the turning point and at most two other lines.' };
}

// Assignment codes hold a name and a list of case keys. They are not secret.
function encodeCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeCode(code) {
  const b64 = code.trim().replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
}

  if (timerHandle) clearInterval(timerHandle);

function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    const el = document.getElementById('timer');
    if (!el || !player || player.submitted) return stopTimer();
    el.textContent = fmtElapsed(Date.now() - player.startedAt);
  }, 1000);
}

function openCase(key, daily) {
  const c = findCase(key);
  if (!c) return note('That case is not available right now.');
  const today = state.daily[dateKey()];
  if (daily && today && today.caseId === key) {
    player = { key, daily: true, picked: today.picked, submitted: true, theory: null, startedAt: Date.now(), elapsed: 0, gained: 0 };
  } else {
    player = { key, daily, picked: null, submitted: false, theory: null, startedAt: Date.now(), elapsed: 0, gained: 0 };
  }
  labState = { q: '', cat: 'All', timeline: false };
  detectDraft = { source: '', contains: '' };
  render();
  if (!player.submitted) startTimer();
  window.scrollTo(0, 0);
}

function closePlayer() {
  stopTimer();
  player = null;
  render();
}

function submitAnswer() {
  if (!player || player.submitted || player.picked === null) return;
  const c = findCase(player.key);
  const theoryRight = player.theory === correctTheory(c);
  const result = recordAttempt(c, player.picked, player.daily, theoryRight);
  player.submitted = true;
  player.elapsed = Date.now() - player.startedAt;
  player.gained = result.gained;
  stopTimer();
  render();
}

function renderLogBody(c) {
  const q = labState.q.trim().toLowerCase();
  const visible = c.lines
    .map((text, i) => ({ text, i }))
    .filter(({ text }) => (labState.cat === 'All' || categoryOf(text) === labState.cat) && (!q || text.toLowerCase().includes(q)));
  if (!visible.length) return '<p class="muted small" style="padding:10px">No lines match your search.</p>';
  let timeline = '';
  if (labState.timeline) {
    const buckets = new Map();
    visible.forEach(({ text }) => {
      const minute = text.slice(0, 5);
      buckets.set(minute, (buckets.get(minute) || 0) + 1);
    });
    const max = Math.max(...buckets.values());
    timeline = `<div class="timeline" aria-label="Events per minute">${[...buckets].map(([m, n]) => `<div class="tl-row"><span>${esc(m)}</span><span class="tl-bar"><span style="width:${Math.round((n / max) * 100)}%"></span></span><span>${n}</span></div>`).join('')}</div>`;
  }
  const lines = visible.map(({ text, i }) => {
    let cls = 'line';
    if (player.submitted) {
      if (i === c.answer) cls += ' correct';
      else if (i === player.picked) cls += ' wrong';
    } else if (i === player.picked) {
      cls += ' selected';
    }
    const src = sourceOf(text);
    const rest = text.slice(9);
    const body = rest.startsWith(src) ? `<span class="src">${esc(src)}</span>${esc(rest.slice(src.length))}` : esc(rest);
    return `<button type="button" class="${cls}" data-action="pick" data-line="${i}"${player.submitted ? ' disabled' : ''}><span class="ln">${i + 1}</span><span class="txt"><span class="ts">${esc(text.slice(0, 8))}</span>${body}</span></button>`;
  }).join('');
  return timeline + lines;
}

  const memberChips = [...TEAM.members, { name: 'You', initials: 'ET' }]
    .map(m => `<span class="member"><i>${esc(m.initials)}</i>${esc(m.name)}</span>`).join('');
  const codes = Object.entries(state.assignments).map(([code, a]) => {
    const solved = a.keys.filter(k => (state.results[k] || {}).correct > 0).length;
    return `<li class="queue-li"><div><div class="qt">${esc(a.name)}</div><div class="qm">${solved} of ${a.keys.length} solved</div></div>
      <div class="row"><button type="button" class="btn small" data-action="start-assignment" data-code="${esc(code)}">Start</button><button type="button" class="btn small" data-action="print-assignment" data-code="${esc(code)}">Worksheet</button><button type="button" class="btn small danger" data-action="remove-assignment" data-code="${esc(code)}">Remove</button></div></li>`;
  }).join('');
  const picks = allCases().filter(c => !c.generated);
  const pickList = picks.map(c => `<label class="check"><input type="checkbox" data-pick-case="${esc(keyOf(c))}"${teacherDraft.picks.includes(keyOf(c)) ? ' checked' : ''}> ${esc(c.title)} <span class="faint small">${esc(c.attack)}</span></label>`).join('');
  return `
  <p class="eyebrow">Better together</p>
  <h1>Better with friends</h1>
  <p class="lead">Friendly competition. Shared learning.</p>
  <div class="split">
    <div class="stack">
      <section class="card">
        <div class="row between"><h2>Friends leaderboard</h2><span class="pill good">Demo</span></div>
        <div class="table-wrap"><table class="board">
          <tbody>${rows}</tbody>
        </table></div>
        <h3 style="margin-top:20px">Friend invite code</h3>
        <div class="code-row">
          <input class="text-input" type="text" readonly value="${esc(state.inviteCode)}" aria-label="Your invite code">
          <button type="button" class="btn" data-action="copy-invite">Copy</button>
        </div>
        <p class="faint small">Invite your friends to your own leaderboard. Adding friends is a demo for now.</p>
      </section>
      <section class="card">
        <h2>Recent activity</h2>
        <ul class="feed">
          <li><div>packetqueen solved #044 Files changing fast<small>12 min ago · Demo</small></div></li>
          <li><div>blue_team_joe started Team challenge #008<small>1 hour ago · Demo</small></div></li>
          <li><div>Maya solved #039 in 1:48<small>3 hours ago · Demo</small></div></li>
        </ul>
      </section>
    </div>
    <div class="stack">
      <section class="card accent">
        <span class="team-tag">Team mode</span>
        <h2 style="margin-top:12px;font-size:26px">${esc(TEAM.name)}</h2>
        <p class="muted small">4 analysts · private team · demo</p>
        <div class="members">${memberChips}</div>
        <p class="team-tag" style="color:var(--accent);background:var(--accent-soft)">Team progress</p>
        <p><strong>${teamTotal} of ${TEAM.goal}</strong> cases solved this sprint</p>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
        <button type="button" class="btn primary" data-action="team-join" style="margin-top:12px">Join team challenge →</button>
        <p class="faint small" style="margin-top:12px">Team challenges are a demo. Joining is not available yet.</p>
      </section>
      <section class="card">
        <h2>Classroom</h2>
        <p class="muted small">Join an assignment with a code, or create one for your students. Results stay in each student's browser.</p>
        <div class="code-row" style="margin-top:12px">
          <input class="text-input" type="text" data-join-code placeholder="Paste an assignment code" aria-label="Assignment code" value="${esc(joinDraft)}">
          <button type="button" class="btn" data-action="join-code">Join</button>
        </div>
        <ul class="queue" style="margin-top:12px">${codes || '<li class="muted">No assignments yet.</li>'}</ul>
        <h3 style="margin-top:18px">Create an assignment</h3>
        <label class="field" style="margin:8px 0"><span>Assignment name</span><input class="text-input" type="text" maxlength="60" data-teacher-name placeholder="Week 3: Windows attacks" value="${esc(teacherDraft.name)}"></label>
        <div class="stack" style="gap:6px;max-height:220px;overflow:auto">${pickList}</div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn primary" style="width:auto" data-action="create-code">Create code</button><button type="button" class="btn" data-action="print-picks">Print worksheet</button></div>
        ${createdCode ? `<p class="muted small" style="margin-top:12px">Share this code with students:</p><div class="code-row"><input class="text-input" type="text" readonly data-created-code value="${esc(createdCode)}" aria-label="Assignment code"><button type="button" class="btn" data-action="copy-code">Copy</button></div>` : ''}
      </section>
    </div>
  </div>`;
}

function viewProgress() {
  const s = getStats();
  const topics = topicStats();
  const lowest = topics[0];
  const focus = lowest ? `Focus next: <strong>${esc(lowest.topic.toLowerCase())}</strong>.` : 'Solve a few cases to see what to practice next.';
  const topicRows = topics.map(t => {
    const pct = Math.round((t.correct / t.attempts) * 100);
    return `<div class="topic-row"><div class="topic-head"><span>${esc(t.topic)}</span><span>${t.correct} / ${t.attempts} · ${pct}%</span></div>
      <div class="bar${pct < 60 ? ' low' : ''}"><span style="width:${pct}%"></span></div></div>`;
  }).join('');
  const history = state.history.slice().reverse().map(h => {
    const c = findCase(h.key);
    return `<tr><td><strong>${esc(c ? c.title : `Case ${h.key}`)}</strong></td><td class="${h.correct ? 'res-ok' : 'res-miss'}">${h.correct ? 'Correct' : 'Missed'}</td><td>${h.points}</td></tr>`;
  }).join('');
  const badges = BADGES.map(b => {
    const on = b.earned(s);
    return `<li class="badge${on ? ' earned' : ' locked'}"><span class="badge-ico">${on
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span>
      <div><div class="b-name">${esc(b.name)}</div><div class="b-sub">${on ? 'Earned' : 'Locked'} · ${esc(b.desc)}</div></div></li>`;
  }).join('');
  return `
  <p class="eyebrow">Build your analyst instincts</p>
  <h1>Your progress</h1>
  <p class="lead">Find what needs practice, collect milestones, and keep your investigation notes.</p>
  <div class="split">
    <div class="stack">
      <section class="card">
        <h2>Your numbers</h2>
        <div class="kpis">
          ${statBlock(s.solved, 'Solved')}
          ${statBlock(`${s.accuracy}%`, 'Accuracy')}
          ${statBlock(s.bestStreak, 'Best streak')}
        </div>
      </section>
      <section class="card">
        <h2>What to practice next</h2>
        <p class="muted small">Correct answers / attempts</p>
        ${topicRows || '<p class="muted">No results yet.</p>'}
        <p>${focus}</p>
        <button type="button" class="btn" data-action="practice-topic" data-topic="${esc(lowest ? lowest.topic : 'All')}"${lowest ? '' : ' disabled'}>Practice this topic →</button>
      </section>
      <section class="card">
        <h2>Recent results</h2>
        <div class="table-wrap"><table class="results">
          <thead><tr><th>Case</th><th>Result</th><th>Score</th></tr></thead>
          <tbody>${history || '<tr><td colspan="3" class="muted">Your answers will show here.</td></tr>'}</tbody>
        </table></div>
      </section>
    </div>
    <div class="stack">
      <section class="card">
        <h2>Your badges</h2>
        <ul class="badges">${badges}</ul>
      </section>
      <section class="card">
        <h2>Share your streak</h2>
        <p class="muted small">Shows your last 7 days. It never reveals the answers.</p>
        <div class="share">${esc(shareText())}</div>
        <button type="button" class="btn" data-action="copy-share">Copy share card</button>
      </section>
    </div>
  </div>
  <section class="card" style="margin-top:16px">
    <div class="notes-head">
      <h2>Your notes</h2>
      <label class="field"><span>Search notes</span><input type="search" data-note-search placeholder="Account, topic, or keyword" value="${esc(notesQuery)}"></label>
    </div>
    <div id="notes-list">${notesListHtml()}</div>
    <div class="row" style="margin-top:14px">
      <button type="button" class="btn" data-action="download-notes">Download my notes</button>
      <button type="button" class="btn danger" data-action="reset">Reset my progress</button>
    </div>
    <p class="faint small" style="margin-top:12px">Progress is saved in this browser. Resetting clears your streak, scores, and notes.</p>
  </section>`;
}

function notesListHtml() {
  const q = notesQuery.trim().toLowerCase();
  const items = Object.keys(state.notes)
    .filter(k => (state.notes[k] || '').trim())
    .map(k => ({ k, c: findCase(k), text: state.notes[k] }))
    .filter(n => !q || `${n.c ? n.c.title : ''} ${n.c ? n.c.topic : ''} ${n.text}`.toLowerCase().includes(q));
  return items.map(n => `<article class="note">
      <h3>${esc(n.c ? n.c.title : `Case ${n.k}`)}</h3>
      <pre>${esc(n.text)}</pre>
      ${n.c ? `<button type="button" class="link" data-action="open-case" data-id="${esc(n.k)}">Open case →</button>` : ''}
    </article>`).join('') || `<p class="muted">${Object.keys(state.notes).length ? 'No notes match your search.' : 'No notes yet. Add notes from any case.'}</p>`;
}

function viewLogin() {
  const signup = authMode === 'signup';
  return `
  <section class="card auth">
    <p class="eyebrow">Your analyst profile</p>
    <h1>${signup ? 'Create your account' : 'Log in to LogHunt'}</h1>
    <p class="lead">Keep your streak, points and notes together. Accounts are saved in this browser.</p>
    <div class="auth-tabs" role="group" aria-label="Log in or create an account">
      <button type="button" data-auth-mode="login" class="${signup ? '' : 'on'}" aria-pressed="${!signup}">Log in</button>
      <button type="button" data-auth-mode="signup" class="${signup ? 'on' : ''}" aria-pressed="${signup}">Create account</button>
    </div>
    <form data-form="auth" novalidate>
      <label class="field"><span>Username</span><input name="username" type="text" autocomplete="username" maxlength="20" placeholder="e.g. analyst_one" value="${esc(authName)}"></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="128" placeholder="At least 8 characters"></label>
      ${signup ? '<label class="field"><span>Confirm password</span><input name="confirm" type="password" autocomplete="new-password" maxlength="128"></label>' : ''}
      <p class="auth-error" data-auth-error role="alert">${esc(authError)}</p>
      <button type="submit" class="btn primary">${signup ? 'Create account' : 'Log in'}</button>
    </form>
    <div class="auth-alt"><button type="button" class="link" data-action="guest">Play as a guest on this device</button></div>
    <p class="faint small">Usernames are lowercase letters, numbers, dots or underscores. Passwords are stored only as salted hashes. Accounts are not synced between devices.</p>
  </section>`;
}

function viewAccount() {
  if (!session) {
    return `
    <section class="card auth">
      <p class="eyebrow">Account</p>
      <h1>You are playing as a guest</h1>
      <p class="lead">Guest progress stays in this browser. Log in to keep a separate profile for each person who uses this device.</p>
      <button type="button" class="btn primary" data-action="show-login">Log in or create an account</button>
    </section>`;
  }
  return `
  <section class="card auth">
    <p class="eyebrow">Account</p>
    <h1>Signed in as ${esc(session)}</h1>
    <p class="lead">Your streak, points, notes and assignments are saved under this account in this browser.</p>
    <div class="row">
      <button type="button" class="btn" data-view="progress">See your progress</button>
      <button type="button" class="btn danger" data-action="logout">Log out</button>
    </div>
  </section>`;
}

const VIEWS = {
  login: viewLogin,
  account: viewAccount,
  today: viewToday,
  practice: viewPractice,
  friends: viewFriends,
  progress: viewProgress
};

function render() {
  document.querySelectorAll('nav [data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === currentView);
  });
  const message = flash ? `<p class="flash" role="status">${esc(flash)}</p>` : '';
  flash = '';
  if (player && !findCase(player.key)) player = null;
  if (!player) stopTimer();
  app.innerHTML = message + (player ? viewPlayer() : VIEWS[currentView]());
  if (player && !player.submitted && !timerHandle) startTimer();
}

// ---------- events ----------

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-view], [data-action], [data-cat], [data-auth-mode]');
  if (!el) return;
  if (el.dataset.view) {
    e.preventDefault();
    // The header person icon opens the login page for guests, and the account page for signed-in players.
    currentView = el.dataset.view === 'account' && !session ? 'login' : el.dataset.view;
    player = null;
    stopTimer();
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (el.dataset.authMode !== undefined) {
    authMode = el.dataset.authMode;
    authError = '';
    render();
    return;
  }
  if (el.dataset.cat !== undefined) {
    labState.cat = el.dataset.cat;
    render();
    return;
  }
  switch (el.dataset.action) {
    case 'open-case': openCase(el.dataset.id, el.dataset.daily === '1'); break;
    case 'pick': player.picked = Number(el.dataset.line); render(); break;
    case 'theory': player.theory = player.theory === el.dataset.theory ? null : el.dataset.theory; render(); break;
    case 'submit': submitAnswer(); break;
    case 'retry': player.picked = null; player.submitted = false; player.theory = null; detectDraft = { source: '', contains: '' }; player.startedAt = Date.now(); render(); break;
    case 'close': closePlayer(); break;
    case 'hint':
      state.hints[player.key] = true;
      saveState();
      render();
      break;
    case 'toggle-timeline':
      labState.timeline = !labState.timeline;
      render();
      break;
    case 'new-random':
      openCase(`gen-${1 + Math.floor(Math.random() * 999999998)}`, false);
      break;
    case 'practice-topic':
      filters.topic = el.dataset.topic || 'All';
      currentView = 'practice';
      player = null;
      render();
      break;
    case 'test-detection':
      detectDraft.result = checkDetection(findCase(player.key), detectDraft.source, detectDraft.contains);
      render();
      break;
    case 'save-detection': {
      const result = checkDetection(findCase(player.key), detectDraft.source, detectDraft.contains);
      detectDraft.result = result;
      if (result.ok) {
        state.bonus[player.key] = true;
        saveState();
        note(`Detection rule saved: +${POINTS_DETECTION} points.`);
      } else {
        render();
      }
      break;
    }
    case 'copy-share':
      note((await copyText(shareText())) ? 'Share card copied.' : 'Could not copy. Select the card text and copy it by hand.');
      break;
    case 'copy-invite':
      note((await copyText(state.inviteCode)) ? 'Invite code copied.' : 'Could not copy. Select the code and copy it by hand.');
      break;
    case 'team-join':
      note('Team challenges are a demo. Joining is not available yet.');
      break;
    case 'download-notes': downloadNotes(); break;
    case 'guest': chooseGuest(); render(); break;
    case 'show-login': currentView = 'login'; authError = ''; render(); break;
    case 'logout': leaveAccount(); note('You are logged out.'); break;
    case 'reset':
      if (confirm('Reset your progress? This clears your streak, scores, and notes.')) {
        const invite = state.inviteCode;
        state = defaultState();
        state.inviteCode = invite;
        saveState();
        note('Progress reset.');
      }
      break;
    case 'join-code': {
      try {
        const data = decodeCode(joinDraft);
        if (typeof data.n !== 'string' || !Array.isArray(data.k) || !data.k.length || !data.k.every(k => KEY_RE.test(String(k)))) throw new Error('bad');
        const code = joinDraft.trim();
        state.assignments[code] = { name: data.n.slice(0, 60), keys: data.k.slice(0, 20).map(String) };
        saveState();
        joinDraft = '';
        note(`Assignment "${state.assignments[code].name}" added.`);
      } catch (err) {
        note('That code is not valid. Check it and try again.');
      }
      break;
    }
    case 'start-assignment': {
      const a = state.assignments[el.dataset.code];
      if (!a) return;
      const next = a.keys.find(k => !((state.results[k] || {}).correct > 0) && findCase(k)) || a.keys.find(k => findCase(k));
      if (next) openCase(next, false);
      else note('None of these cases are available yet.');
      break;
    }
    case 'print-assignment': {
      const a = state.assignments[el.dataset.code];
      if (a) printKeys(a.keys, a.name);
      break;
    }
    case 'remove-assignment':
      delete state.assignments[el.dataset.code];
      saveState();
      render();
      break;
    case 'create-code': {
      if (!teacherDraft.picks.length) return note('Pick at least one case first.');
      const name = (teacherDraft.name.trim() || 'Untitled assignment').slice(0, 60);
      createdCode = encodeCode({ n: name, k: teacherDraft.picks });
      state.assignments[createdCode] = { name, keys: teacherDraft.picks.slice(0, 20) };
      saveState();
      render();
      break;
    }
    case 'print-picks':
      if (!teacherDraft.picks.length) return note('Pick at least one case first.');
      printKeys(teacherDraft.picks, teacherDraft.name.trim() || 'LogHunt worksheet');
      break;
    case 'copy-code':
      note((await copyText(createdCode)) ? 'Code copied.' : 'Could not copy. Select the code and copy it by hand.');
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) {
    if (!Object.prototype.hasOwnProperty.call(filters, t.dataset.filter)) return;
    filters[t.dataset.filter] = t.value;
    render();
  } else if (t.dataset.detectSource !== undefined) {
    detectDraft.source = t.value;
    detectDraft.result = null;
  } else if (t.dataset.pickCase !== undefined) {
    const key = t.dataset.pickCase;
    teacherDraft.picks = t.checked
      ? [...new Set([...teacherDraft.picks, key])]
      : teacherDraft.picks.filter(k => k !== key);
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.noteId !== undefined) {
    if (!KEY_RE.test(t.dataset.noteId)) return;
    state.notes[t.dataset.noteId] = t.value.slice(0, NOTE_MAX);
    saveState();
  } else if (t.dataset.labSearch !== undefined) {
    labState.q = t.value;
    refreshLog();
  } else if (t.dataset.practiceSearch !== undefined) {
    practiceQuery = t.value;
    document.getElementById('practice-list').innerHTML = practiceListHtml();
    document.getElementById('practice-count').textContent = `${practiceItems().length} cases`;
  } else if (t.dataset.noteSearch !== undefined) {
    notesQuery = t.value;
    document.getElementById('notes-list').innerHTML = notesListHtml();
  } else if (t.dataset.detectContains !== undefined) {
    detectDraft.contains = t.value;
    detectDraft.result = null;
  } else if (t.dataset.teacherName !== undefined) {
    teacherDraft.name = t.value;
  } else if (t.dataset.joinCode !== undefined) {
    joinDraft = t.value;
  }
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.dataset.form !== 'auth') return;
  e.preventDefault();
  const data = new FormData(form);
  const name = String(data.get('username') || '').trim().toLowerCase();
  const password = String(data.get('password') || '');
  authName = name;
  authError = '';
  if (!USERNAME_RE.test(name)) {
    authError = 'Use 3 to 20 letters, numbers, dots or underscores.';
  } else if (password.length < 8 || password.length > 128) {
    authError = 'Your password must be at least 8 characters.';
  } else if (authMode === 'signup') {
    if (loadAccounts()[name]) {
      authError = 'That username is taken. Try another one.';
    } else if (password !== String(data.get('confirm') || '')) {
      authError = 'The two passwords do not match.';
    } else if (!(await createAccount(name, password))) {
      authError = 'Could not save your account. Check that this browser allows site storage.';
    } else {
      enterAccount(name);
      note(`Account created. Welcome, ${name}.`);
      return;
    }
  } else if (await passwordMatches(name, password)) {
    enterAccount(name);
    note(`Welcome back, ${name}.`);
    return;
  } else {
    authError = 'Wrong username or password.';
  }
  render();
});

// ---------- start up ----------

fetch('community/cases/index.json', { cache: 'no-cache' })
  .then(res => (res.ok ? res.json() : []))
  .then(list => {
    if (!Array.isArray(list)) return;
    communityCases = list.filter(isValidCommunityCase).map(c => ({ ...c, community: true }));
    if (!player && (currentView === 'practice')) render();
  })
  .catch(() => {});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
